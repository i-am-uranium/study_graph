services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studygraph}
      POSTGRES_USER: ${POSTGRES_USER:-studygraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studygraph} -d ${POSTGRES_DB:-studygraph}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studygraph}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studygraph}
      UPLOAD_DIR: /app/storage/uploads
      UNSTRUCTURED_API_URL: http://unstructured-api:8000/general/v0/general
      OPENAI_BASE_URL: http://ollama:11434/v1
      CHAT_MODEL: qwen3:8b
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: "1024"
      SEND_EMBEDDING_DIMENSIONS: "false"
      RERANK_ENABLED: "true"
      RERANK_BASE_URL: http://reranker:7997
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RETRIEVAL_CANDIDATE_K: "30"
      RETRIEVAL_TOP_K: "8"
    volumes:
      - uploaded_files:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      reranker:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studygraph}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studygraph}
      UPLOAD_DIR: /app/storage/uploads
      UNSTRUCTURED_API_URL: http://unstructured-api:8000/general/v0/general
      OPENAI_BASE_URL: http://ollama:11434/v1
      CHAT_MODEL: qwen3:8b
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: "1024"
      SEND_EMBEDDING_DIMENSIONS: "false"
      RERANK_ENABLED: "true"
      RERANK_BASE_URL: http://reranker:7997
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RETRIEVAL_CANDIDATE_K: "30"
      RETRIEVAL_TOP_K: "8"
    volumes:
      - uploaded_files:/app/storage/uploads
    depends_on:
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    command: python -m app.worker

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    # To run Ollama on an NVIDIA GPU, install the NVIDIA Container Toolkit on
    # the host and uncomment the block below to reserve the GPU for this service.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull qwen3:8b && ollama pull qwen3-embedding:0.6b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  reranker:
    image: michaelf34/infinity:latest
    restart: unless-stopped
    command: ["v2", "--model-id", "BAAI/bge-reranker-v2-m3", "--device", "cpu", "--engine", "torch", "--port", "7997"]
    volumes:
      - hf_cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:
  ollama_models:
  hf_cache:
