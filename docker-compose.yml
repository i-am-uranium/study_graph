services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studygraph
      POSTGRES_USER: studygraph
      POSTGRES_PASSWORD: studygraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygraph -d studygraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      UPLOAD_DIR: /app/storage/uploads
      UNSTRUCTURED_API_URL: http://unstructured-api:8000/general/v0/general
    ports:
      - "8000:8000"
    volumes:
      - uploaded_files:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      UPLOAD_DIR: /app/storage/uploads
      UNSTRUCTURED_API_URL: http://unstructured-api:8000/general/v0/general
    volumes:
      - uploaded_files:/app/storage/uploads
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.worker

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  uploaded_files:
  frontend_node_modules:
