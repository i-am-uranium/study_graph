services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studygraph
      POSTGRES_USER: studygraph
      POSTGRES_PASSWORD: studygraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygraph -d studygraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      UPLOAD_DIR: /app/storage/uploads
      UNSTRUCTURED_API_URL: http://unstructured-api:8000/general/v0/general
      OPENAI_BASE_URL: http://ollama:11434/v1
      CHAT_MODEL: qwen3:8b
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: "1024"
      SEND_EMBEDDING_DIMENSIONS: "false"
      RERANK_ENABLED: "true"
      RERANK_BASE_URL: http://reranker:7997
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RETRIEVAL_CANDIDATE_K: "30"
      RETRIEVAL_TOP_K: "8"
    ports:
      - "8000:8000"
    volumes:
      - uploaded_files:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      reranker:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      UPLOAD_DIR: /app/storage/uploads
      UNSTRUCTURED_API_URL: http://unstructured-api:8000/general/v0/general
      OPENAI_BASE_URL: http://ollama:11434/v1
      CHAT_MODEL: qwen3:8b
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: "1024"
      SEND_EMBEDDING_DIMENSIONS: "false"
      RERANK_ENABLED: "true"
      RERANK_BASE_URL: http://reranker:7997
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RETRIEVAL_CANDIDATE_K: "30"
      RETRIEVAL_TOP_K: "8"
    volumes:
      - uploaded_files:/app/storage/uploads
    depends_on:
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    command: python -m app.worker

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull qwen3:8b && ollama pull qwen3-embedding:0.6b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  reranker:
    image: michaelf34/infinity:latest
    command: ["v2", "--model-id", "BAAI/bge-reranker-v2-m3", "--device", "cpu", "--engine", "torch", "--port", "7997"]
    ports:
      - "7997:7997"
    volumes:
      - hf_cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  uploaded_files:
  frontend_node_modules:
  ollama_models:
  hf_cache:
